name: Sync master

# master follows dev: once CI ("Android") passes for a push to dev, master moves to that same commit.
# Fast-forward only, so master never loses a commit; work happens on dev.
on:
  workflow_run:
    workflows: [Android]
    types: [completed]
    branches: [dev]

permissions:
  contents: write

concurrency:
  group: sync-master
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fast-forward master to the tested dev commit
        env:
          TESTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin master dev
          if git merge-base --is-ancestor "$TESTED" origin/master; then
            echo "master already has $TESTED."
          elif git merge-base --is-ancestor origin/master "$TESTED"; then
            git push origin "$TESTED:refs/heads/master"
            echo "master moved to $TESTED."
          else
            echo "::error::master has commits that dev doesn't; not syncing. Bring them into dev first."
            exit 1
          fi
