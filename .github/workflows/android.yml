name: Android

on:
  push:
    branches: [master, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Build, lint and unit-test
        run: ./gradlew :app:assembleDebug :app:lintDebug :app:detekt :app:testDebugUnitTest :app:assembleDebugAndroidTest

      - name: Minified build (R8)
        run: ./gradlew :app:assembleMinified

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
