name: Android

on:
  push:
    branches: [master, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # Robolectric downloads its Android jars from Maven on first use; keep them, so a slow or failed download
      # doesn't fail the tests.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Build, lint and unit-test
        run: >-
          ./gradlew :app:assembleStagingDebug :app:assembleProductionDebug :app:lintStagingDebug :app:detekt
          :app:testStagingDebugUnitTest :app:assembleStagingDebugAndroidTest

      # The shrunk release app on staging, signed with the debug key; productionRelease needs the upload key.
      - name: Release build on staging (R8)
        run: ./gradlew :app:assembleStagingRelease

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
